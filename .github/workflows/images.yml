# Turns the AI images listed in tools/images.json into WebP files in public/images and commits them.
# Runs when the image list changes, or by hand from the Actions tab. The website itself needs no build.
name: Make website images

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/images.json"
      - "tools/images.mjs"
      - ".github/workflows/images.yml"

permissions:
  contents: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the image converter (for this job only)
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.35.5

      - name: Download and convert images
        run: node tools/images.mjs

      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "No new images."
            exit 0
          fi
          git commit -m "Add website images from tools/images.json"
          git push
